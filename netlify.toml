[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Old Wix addresses → new pages, so existing links keep working.
[[redirects]]
  from = "/research-hub"
  to = "/cookbook/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/join-us/"
  status = 301

# Images, fonts and PDFs rarely change — let browsers cache them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# PDF viewer library (ES modules)
[[headers]]
  for = "/assets/vendor/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
[[headers]]
  for = "/assets/vendor/pdfjs/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=2592000"

# Don't compress PDFs: compression stops the in-site viewer from loading just the
# pages it needs (byte-range requests), forcing a full 20 MB download first.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800, no-transform"
