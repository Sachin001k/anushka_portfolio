<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{siteUrl}}/assets/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#08431e">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Figtree:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/main.js" defer></script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {{> header}}
  <main id="main">
{{content}}
  </main>
  {{> footer}}
</body>
</html>
