<div class="post-wrap">
  <a class="crumb" href="/blog/">All Posts</a>
  <article class="post">
    <div class="byline">
      <span class="byline__avatar" aria-hidden="true">{{initial}}</span>
      <div class="byline__meta">
        <span>{{author}}</span>
        <time datetime="{{datetime}}">{{date}}</time>
        <span>{{readTime}}</span>
      </div>
    </div>
    <h1 class="post__title">{{title}}</h1>
    {{pdf}}
    <div class="post__body">
{{body}}
    </div>
    <div class="post__share" role="group" aria-label="Share this post">
      <a href="https://www.facebook.com/sharer/sharer.php?u={{shareUrl}}" target="_blank" rel="noopener" aria-label="Share on Facebook"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21v-7.5H16l.4-3H13.5V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.2H8v3h2.5V21h3z"/></svg></a>
      <a href="https://twitter.com/intent/tweet?url={{shareUrl}}&amp;text={{shareText}}" target="_blank" rel="noopener" aria-label="Share on X"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.2-8.3L1.9 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg></a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{shareUrl}}" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3V9.75zm6.5 0h3.8v1.6h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5c0-1.2 0-2.75-1.68-2.75s-1.94 1.3-1.94 2.66V21h-4V9.75z"/></svg></a>
      <button type="button" data-copy-link aria-label="Copy link"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></button>
    </div>
  </article>

  <section class="recent" aria-labelledby="recent-title">
    <div class="recent__head">
      <h2 id="recent-title">Recent Posts</h2>
      <a href="/blog/">See All</a>
    </div>
    <div class="recent__grid">
{{recent}}
    </div>
  </section>
</div>
