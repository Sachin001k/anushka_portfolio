    <article class="post-card">
      <img class="post-card__img" src="{{cover}}" alt="" loading="lazy" width="454" height="341">
      <div class="post-card__body">
        <div class="byline">
          <span class="byline__avatar" aria-hidden="true">{{initial}}</span>
          <div class="byline__meta">
            <span>{{author}}</span>
            <span><time datetime="{{datetime}}">{{date}}</time><span class="dot">·</span>{{readTime}}</span>
          </div>
        </div>
        <h2><a href="{{url}}">{{title}}</a></h2>
        <p>{{excerpt}}</p>
      </div>
    </article>
